name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Deterministic gameplay tests
        run: bun test scripts/

      - name: Static export build (GitHub Pages artifact)
        run: bun run build:pages

      - name: Verify the export contains the game entry
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -d out/assets/manifests
          grep -q 'assets' out/index.html

      # TypeScript runs after the build so Next has finished generating
      # its route types (see docs/NEXT_PHASES.md, phase 6).
      - name: Typecheck
        run: bun x tsc --noEmit
